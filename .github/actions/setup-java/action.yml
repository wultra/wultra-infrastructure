name: "Setup Java"
description: "Action for setting up Java"

inputs:
  java_version:
    description: "Version of Java to use"
    default: '21' # Do not change the default to version 25, as it may break the build

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java_version }}
        distribution: 'temurin'
        server-id: jfrog-central
        server-username: INTERNAL_USERNAME
        server-password: INTERNAL_PASSWORD