name: "Resolve Docker tags"
description: "Resolves and sets Docker image tags for ACR and distribution registries"

inputs:
  app_to_build:
    description: "Application to build (e.g., mobile-utility-server)"
    required: true
  app_version:
    description: "Application version"
    required: false

outputs:
  tags:
    description: "Resolved image tags for main image"
    value: ${{ steps.set-dynamic-tags.outputs.TAGS }}
  init_tags:
    description: "Resolved image tags for init image"
    value: ${{ steps.set-dynamic-tags.outputs.INIT_TAGS }}

runs:
  using: "composite"
  steps:
    - name: Set Timestamp for docker image for development branch
      if: "!(startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/releases/') || startsWith(github.ref, 'refs/tags/'))"
      shell: bash
      run: echo "TIMESTAMP=-$(date +%Y.%m.%d)" >> $GITHUB_ENV
    - name: Set ${{ inputs.app_to_build }} variables
      shell: bash
      run: |
        echo "----- Setting tags for nondistribution -----"
        IMAGE_VERSION=${{ inputs.app_version }}${{ env.TIMESTAMP }}-${{ github.sha }}
        IMAGE_NAME=${{ inputs.app_to_build }}:${IMAGE_VERSION}
        INIT_IMAGE_NAME=${{ inputs.app_to_build }}-init:${IMAGE_VERSION}

        echo "revision=${{ inputs.app_version }}" >> $GITHUB_ENV
        echo "image_version=$IMAGE_VERSION" >> $GITHUB_ENV
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
        echo "INIT_IMAGE_NAME=$INIT_IMAGE_NAME" >> $GITHUB_ENV

        echo "----- Setting tags for distribution -----"
        DIST_IMAGE_VERSION=${{ inputs.app_version }}${{ env.TIMESTAMP }}-${{ github.sha }}
        DIST_IMAGE_NAME=${{ inputs.app_to_build }}:${DIST_IMAGE_VERSION}
        DIST_INIT_IMAGE_NAME=${{ inputs.app_to_build }}-init:${DIST_IMAGE_VERSION}

        echo "dist_image_version=$DIST_IMAGE_VERSION" >> $GITHUB_ENV
        echo "DIST_IMAGE_NAME=$DIST_IMAGE_NAME" >> $GITHUB_ENV
        echo "DIST_INIT_IMAGE_NAME=$DIST_INIT_IMAGE_NAME" >> $GITHUB_ENV
    - name: Set dynamic tags for image
      id: set-dynamic-tags
      shell: bash
      run: |
        {
          echo "TAGS<<EOF"
            echo "${{ env.ACR_REGISTRY_URL != ''  && format('{0}/{1}', env.ACR_REGISTRY_URL, env.IMAGE_NAME) || '' }}"
            echo "${{ env.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', env.DISTRIBUTION_REGISTRY_URL, env.DIST_IMAGE_NAME) || '' }}"
          echo "EOF"
        } >> $GITHUB_OUTPUT
        {
         echo "INIT_TAGS<<EOF"
            echo "${{ env.ACR_REGISTRY_URL != ''  && format('{0}/{1}', env.ACR_REGISTRY_URL, env.INIT_IMAGE_NAME) || '' }}"
            echo "${{ env.DISTRIBUTION_REGISTRY_URL != '' && format('{0}/{1}', env.DISTRIBUTION_REGISTRY_URL, env.DIST_INIT_IMAGE_NAME) || '' }}"
          echo "EOF"
        } >> $GITHUB_OUTPUT

