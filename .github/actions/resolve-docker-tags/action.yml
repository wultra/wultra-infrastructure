name: "Resolve Docker tags"
description: >
  Resolves Docker image tags for ACR and distribution registries.
  Release builds (releases/*, release/*, tags) get an incremental suffix '<version>_<N>',
  where N is one more than the highest suffix already published for that version in any configured registry.
  ACR tags additionally carry the commit SHA ('<version>_<N>-<sha>').

inputs:
  app_to_build:
    description: "Application to build (e.g., mobile-utility-server)"
    required: true
  app_version:
    description: "Application version"
    required: false
  push_latest:
    description: "Whether to also push 'latest' tag to the distribution registry"
    required: false
    default: "false"

outputs:
  tags:
    description: "Resolved image tags for main image"
    value: ${{ steps.set-tags.outputs.TAGS }}
  init_tags:
    description: "Resolved image tags for init image"
    value: ${{ steps.set-tags.outputs.INIT_TAGS }}
  image_version:
    description: "Resolved image version (e.g. 1.9.3_2 for release builds)"
    value: ${{ steps.set-tags.outputs.image_version }}

runs:
  using: "composite"
  steps:
    - name: Detect release build
      id: detect-release
      shell: bash
      env:
        GIT_REF: ${{ github.ref }}
      run: |
        if [[ "$GIT_REF" == refs/heads/release/* || "$GIT_REF" == refs/heads/releases/* || "$GIT_REF" == refs/tags/* ]]; then
          echo "is_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_release=false" >> "$GITHUB_OUTPUT"
        fi

    # skopeo reads the credentials stored by docker login.
    - name: Log in to ACR
      if: steps.detect-release.outputs.is_release == 'true' && env.ACR_REGISTRY_URL != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ env.ACR_REGISTRY_URL }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ env.ACR_PASSWORD }}
    - name: Extract registry host
      if: steps.detect-release.outputs.is_release == 'true' && env.DISTRIBUTION_REGISTRY_URL != ''
      id: extract_registry_host
      shell: bash
      env:
        REGISTRY_URL: ${{ env.DISTRIBUTION_REGISTRY_URL }}
      run: echo "registry_host=${REGISTRY_URL%%/*}" >> "$GITHUB_OUTPUT"
    - name: Log in to Distribution registry
      if: steps.detect-release.outputs.is_release == 'true' && env.DISTRIBUTION_REGISTRY_URL != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ steps.extract_registry_host.outputs.registry_host }}
        username: ${{ env.DISTRIBUTION_USERNAME }}
        password: ${{ env.DISTRIBUTION_PASSWORD }}

    - name: Determine next tag suffix for ${{ inputs.app_to_build }}
      id: tag-increment
      if: steps.detect-release.outputs.is_release == 'true'
      shell: bash
      env:
        APP: ${{ inputs.app_to_build }}
        APP_VERSION: ${{ inputs.app_version }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit

        version_re=$(printf '%s' "$APP_VERSION" | sed 's/[][\.*^$+?(){}|/]/\\&/g')
        max_suffix=0
        err=$(mktemp)
        trap 'rm -f "$err"' EXIT

        # Docker Hub answers 'denied' instead of 'not found' for a missing repository, so its absence is confirmed
        # by the Docker Hub API. $1 image repository
        docker_hub_missing() {
          local path="${1#docker.io/}"
          [[ "$1" == docker.io/*/* ]] && grep -qi 'requested access to the resource is denied' "$err" \
            && [[ $(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/namespaces/${path%%/*}/repositories/${path#*/}") == 404 ]]
        }

        # Prints the highest suffix in a repository, 0 if the repository does not exist.
        # Any other lookup failure is fatal, so an existing suffix is never reused.
        # $1 image repository, $2 regex capturing the suffix
        highest_suffix() {
          local out max
          if ! out=$(skopeo list-tags "docker://$1" 2>"$err"); then
            if grep -qiE 'name_unknown|name unknown' "$err" || docker_hub_missing "$1"; then
              echo "::notice::Repository $1 does not exist yet" >&2
              echo 0
              return 0
            fi
            echo "::error::Failed to list tags of $1: $(<"$err")" >&2
            return 1
          fi
          max=$(jq -r '.Tags // [] | .[]' <<<"$out" | sed -nE "s/$2/\1/p" | sort -n | tail -1)
          echo "$((10#${max:-0}))"
        }

        # The main and init images share the suffix. $1 registry, $2 regex capturing the suffix
        check_registry() {
          local repo s
          for repo in "$1/${APP}" "$1/${APP}-init"; do
            s=$(highest_suffix "$repo" "$2")
            echo "Highest suffix of ${repo}:${APP_VERSION}_* is ${s}"
            if (( s > max_suffix )); then max_suffix=$s; fi
          done
        }

        if [[ -n "${ACR_REGISTRY_URL:-}" ]]; then
          check_registry "$ACR_REGISTRY_URL" "^${version_re}_([0-9]+)-.*$"
        fi
        if [[ -n "${DISTRIBUTION_REGISTRY_URL:-}" ]]; then
          check_registry "$DISTRIBUTION_REGISTRY_URL" "^${version_re}_([0-9]+)$"
        fi

        next=$((max_suffix + 1))
        echo "::notice::Next tag suffix for ${APP}:${APP_VERSION} is _${next}"
        echo "suffix=_${next}" >> "$GITHUB_OUTPUT"

    - name: Set ${{ inputs.app_to_build }} tags
      id: set-tags
      shell: bash
      env:
        APP: ${{ inputs.app_to_build }}
        APP_VERSION: ${{ inputs.app_version }}
        IS_RELEASE: ${{ steps.detect-release.outputs.is_release }}
        SUFFIX: ${{ steps.tag-increment.outputs.suffix }}
        PUSH_LATEST: ${{ inputs.push_latest }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [[ "$IS_RELEASE" == "true" ]]; then
          DIST_IMAGE_VERSION="${APP_VERSION}${SUFFIX}"
          IMAGE_VERSION="${DIST_IMAGE_VERSION}-${SHA}"
        else
          TIMESTAMP="-$(date +%Y.%m.%d)"
          IMAGE_VERSION="${APP_VERSION}${TIMESTAMP}-${SHA}"
          DIST_IMAGE_VERSION="${APP_VERSION}${TIMESTAMP}-${SHA}"
        fi
        echo "image_version=${DIST_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

        tags=() init_tags=()
        if [[ -n "${ACR_REGISTRY_URL:-}" ]]; then
          tags+=("${ACR_REGISTRY_URL}/${APP}:${IMAGE_VERSION}")
          init_tags+=("${ACR_REGISTRY_URL}/${APP}-init:${IMAGE_VERSION}")
        fi
        if [[ -n "${DISTRIBUTION_REGISTRY_URL:-}" ]]; then
          tags+=("${DISTRIBUTION_REGISTRY_URL}/${APP}:${DIST_IMAGE_VERSION}")
          init_tags+=("${DISTRIBUTION_REGISTRY_URL}/${APP}-init:${DIST_IMAGE_VERSION}")
          if [[ "$PUSH_LATEST" == "true" ]]; then
            tags+=("${DISTRIBUTION_REGISTRY_URL}/${APP}:latest")
            init_tags+=("${DISTRIBUTION_REGISTRY_URL}/${APP}-init:latest")
          fi
        fi

        {
          echo "TAGS<<EOF"
          printf '%s\n' "${tags[@]}"
          echo "EOF"
          echo "INIT_TAGS<<EOF"
          printf '%s\n' "${init_tags[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Resolved tags:"; printf '  %s\n' "${tags[@]}" "${init_tags[@]}"
