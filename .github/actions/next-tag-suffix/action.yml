name: "Next tag suffix"
description: >
  Replaces the '{N}' placeholder in image tags (e.g. 'registry/app:1.9.3_{N}') with the next free incremental suffix.
  N is one more than the highest suffix already published in any of the given repositories,
  matching tags '<text before {N}><N>' optionally followed by '-...'.
  Within one job the same N is reused for the same version (e.g. main and init image), unless it is already taken.
  Registries are queried with the credentials of the preceding 'docker login'. Any lookup failure is fatal.

inputs:
  tags:
    description: "Newline separated image tags, tags containing '{N}' are resolved"
    required: true

outputs:
  tags:
    description: "Image tags with '{N}' replaced"
    value: ${{ steps.resolve.outputs.tags }}
  suffix:
    description: "Resolved suffix number N, empty if no tag contained the placeholder"
    value: ${{ steps.resolve.outputs.suffix }}

runs:
  using: "composite"
  steps:
    - name: Resolve tag suffix
      id: resolve
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        STATE_DIR: ${{ runner.temp }}/next-tag-suffix
      run: |
        set -euo pipefail
        shopt -s inherit_errexit

        # Prints the registry host of an image repository as skopeo resolves it.
        registry_host() {
          local first="${1%%/*}"
          if [[ "$1" == */* && ( "$first" == *.* || "$first" == *:* || "$first" == localhost ) ]]; then
            echo "$first"
          else
            echo "docker.io"
          fi
        }

        # Prints the highest suffix found in a repository, 0 if the repository does not exist or has no matching tag.
        # Any other lookup failure is fatal, so an existing suffix is never reused.
        # $1 image repository, $2 tag prefix preceding the suffix
        highest_suffix() {
          local repo="$1" prefix_re out err repo_tags max authenticated=false
          prefix_re=$(printf '%s' "$2" | sed 's/[][\.*^$+?(){}|/]/\\&/g')
          if skopeo login --get-login "$(registry_host "$repo")" >/dev/null 2>&1; then
            authenticated=true
          fi
          err=$(mktemp)
          if ! out=$(skopeo list-tags "docker://${repo}" 2>"$err"); then
            # Docker Hub answers 'denied' for missing repositories; with valid credentials a later push would fail anyway.
            if grep -qiE 'name_unknown|name unknown|repository name not known' "$err" \
              || { [[ "$authenticated" == "true" ]] && grep -qiE 'requested access to the resource is denied' "$err"; }; then
              echo "::notice::Repository ${repo} does not exist yet" >&2
              rm -f "$err"
              echo 0
              return 0
            fi
            echo "::error::Failed to list tags of ${repo}: $(cat "$err")" >&2
            rm -f "$err"
            return 1
          fi
          rm -f "$err"
          if ! repo_tags=$(jq -r '.Tags // [] | .[]' <<<"$out" 2>&1); then
            echo "::error::Failed to parse tag list of ${repo}: ${repo_tags}" >&2
            return 1
          fi
          max=$(sed -nE "s/^${prefix_re}([0-9]+)(-.*)?$/\1/p" <<<"$repo_tags" | sort -n | tail -1)
          echo "${max:-0}"
        }

        state_file() {
          echo "${STATE_DIR}/$(printf '%s' "$1" | sha256sum | cut -c1-16)"
        }

        lines=() prefixes=() next=0
        while IFS= read -r line; do
          line=$(xargs <<<"$line")
          [[ -z "$line" ]] && continue
          lines+=("$line")
          [[ "$line" != *'{N}'* ]] && continue

          repo="${line%:*}" tag="${line##*:}"
          if [[ "$line" != *:* || "$tag" == */* || "$repo" == *'{N}'* || "$tag" == *'{N}'*'{N}'* ]]; then
            echo "::error::Tag '${line}' must contain exactly one '{N}' placeholder in its tag part" >&2
            exit 1
          fi
          prefix="${tag%%\{N\}*}"
          prefixes+=("$prefix")

          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo >/dev/null
          fi
          s=$(highest_suffix "$repo" "$prefix")
          echo "Highest suffix of ${repo}:${prefix}* is ${s}"
          if (( s + 1 > next )); then next=$((s + 1)); fi
        done <<<"$TAGS"

        suffix=""
        if (( ${#prefixes[@]} > 0 )); then
          # Reuse the suffix already chosen in this job for the same version, so related images share it.
          mkdir -p "$STATE_DIR"
          for prefix in "${prefixes[@]}"; do
            f=$(state_file "$prefix")
            if [[ -f "$f" ]] && (( $(<"$f") > next )); then next=$(<"$f"); fi
          done
          for prefix in "${prefixes[@]}"; do
            echo "$next" > "$(state_file "$prefix")"
          done
          suffix="$next"
          echo "::notice::Using tag suffix ${suffix}"
        fi

        resolved=()
        for line in "${lines[@]}"; do resolved+=("${line//\{N\}/$suffix}"); done
        {
          echo "suffix=${suffix}"
          echo "tags<<EOF"
          printf '%s\n' "${resolved[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Resolved tags:"; printf '  %s\n' "${resolved[@]}"
